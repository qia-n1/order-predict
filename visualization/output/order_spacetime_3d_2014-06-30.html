  <script>
    function showError(title, detail) {
      const el = document.getElementById('canvasContainer');
      const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
      el.innerHTML =
        '<div style="padding:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#f85149;font:14px/1.6 system-ui,sans-serif">' +
        '<strong style="font-size:16px;margin-bottom:16px">' + esc(title) + '</strong>' +
        '<pre style="color:#9aa0a6;white-space:pre-wrap;word-break:break-all;font-size:12px;max-width:600px">' + esc(detail) + '</pre>' +
        '</div>';
    }

    const rawMeta = document.getElementById('embed-meta').textContent.trim();
    const rawData = document.getElementById('embed-data').textContent.trim();
    if (rawMeta.includes('@@EMBED') || rawData.includes('@@EMBED')) {
      showError('数据未嵌入', '请运行: python visualization/scripts/build_spacetime_deck_3d.py');
      throw new Error('placeholder');
    }
    let meta;
    let FULL;
    try {
      meta = JSON.parse(rawMeta);
      FULL = JSON.parse(rawData);
    } catch (e) {
      showError('JSON 解析失败', e && e.message ? e.message : String(e));
      throw e;
    }

    const slots = meta.time_slots_ms || [];
    const n = slots.length;
    const windowHours = meta.window_hours || 1;
    const hourMs = 3600000;
    let idx = 0;
    let mode = 'count';
    let playing = false;
    let playTimer = null;
    let pitch3d = true;

    let countMax = meta.count_max;
    let predictionMax = meta.prediction_max;
    if (countMax == null || predictionMax == null) {
      let cm = 1, pm = 1;
      for (const d of FULL) {
        cm = Math.max(cm, d.count);
        pm = Math.max(pm, d.prediction);
      }
      if (countMax == null) countMax = cm;
      if (predictionMax == null) predictionMax = pm;
    }

    const sums = (meta.hourly_totals || []).map(Number);
    while (sums.length < n) sums.push(0);

    const BIN = [
      { max: 1, rgb: [247, 251, 255] },
      { max: 2, rgb: [222, 235, 247] },
      { max: 5, rgb: [158, 202, 225] },
      { max: 15, rgb: [49, 130, 189] },
      { max: Infinity, rgb: [8, 81, 156] },
    ];

    function elevOf(d) {
      const v = mode === 'count' ? d.count : d.prediction;
      return Math.max(0, v);
    }
    function gMax() {
      return mode === 'count' ? countMax : predictionMax;
    }
    function fillColor(v) {
      if (v < 1) return [247, 251, 255, 220];
      if (v < 2) return [222, 235, 247, 230];
      if (v < 5) return [158, 202, 225, 240];
      if (v < 15) return [49, 130, 189, 250];
      return [8, 81, 156, 255];
    }
    function sliceData() {
      const tStart = slots[idx];
      const tEnd = slots[Math.min(idx + windowHours - 1, n - 1)] + hourMs;
      return FULL.filter((d) => d.t >= tStart && d.t < tEnd);
    }
    function renderLegend(gm) {
      const field = mode === 'count' ? 'count' : 'prediction';
      document.getElementById('legendMetric').textContent = field;
      document.getElementById('legendNote').textContent = 'Height Scale by ' + field;
      const top = Math.max(Number(gm) || 0, 15);
      const labels = ['1.00 to 1.00', '1.00 to 2.00', '2.00 to 5.00', '5.00 to 15.00', '15.00 to ' + top.toFixed(2)];
      const rows = document.getElementById('legendRows');
      rows.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const c = BIN[i].rgb;
        const el = document.createElement('div');
        el.className = 'leg-row';
        el.innerHTML = '<div class="leg-swatch" style="background:rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')"></div><span style="color:#bdc1c6;font-size:10px">' + labels[i] + '</span>';
        rows.appendChild(el);
      }
    }
    function updateHud() {
      const tA = new Date(slots[idx]);
      const tB = new Date(slots[Math.min(idx + windowHours - 1, n - 1)] + hourMs);
      const dateFmt = new Intl.DateTimeFormat('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' });
      const timeFmt = new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
      const d = meta.display_date || dateFmt.format(tA);
      const r = timeFmt.format(tA) + ' – ' + timeFmt.format(tB);
      document.getElementById('hudDate').textContent = d;
      document.getElementById('hudTime').textContent = r;
      document.getElementById('barDate').textContent = d;
      document.getElementById('barRange').textContent = r;
    }
    const histCanvas = document.getElementById('hist');
    const brush = document.getElementById('brush');
    const t0slider = document.getElementById('t0');
    const playBtn = document.getElementById('play');
    const speedEl = document.getElementById('speed');
    const speedValEl = document.getElementById('speedVal');
    const timeAxisEl = document.getElementById('timeAxis');

    t0slider.max = Math.max(0, n - windowHours);

    function speedMult() {
      const s = parseInt(speedEl.value, 10) || 4;
      return 0.2 + ((s - 1) / 9) * 1.2;
    }
    function drawTimeAxis() {
      timeAxisEl.innerHTML = '';
      const tickHours = [0, 3, 6, 9, 12, 15, 18, 21];
      const fmt = new Intl.DateTimeFormat('en-US', { hour: 'numeric', hour12: true });
      for (const th of tickHours) {
        let best = -1, bestDiff = 999;
        for (let i = 0; i < slots.length; i++) {
          const h = new Date(slots[i]).getHours();
          const diff = Math.abs(h - th);
          if (diff < bestDiff) {
            bestDiff = diff;
            best = i;
          }
        }
        if (best >= 0) {
          const el = document.createElement('span');
          el.textContent = fmt.format(new Date(slots[best]));
          el.style.left = ((best / (slots.length - 1)) * 100) + '%';
          timeAxisEl.appendChild(el);
        }
      }
    }
    function drawHist() {
      const ctx = histCanvas.getContext('2d');
      ctx.clearRect(0, 0, histCanvas.width, histCanvas.height);
      const maxSum = Math.max(...sums, 1);
      const w = histCanvas.width / n;
      for (let i = 0; i < n; i++) {
        const h = (sums[i] / maxSum) * (histCanvas.height - 6);
        const x = i * w;
        const alpha = i >= idx && i < idx + windowHours ? 0.9 : 0.3;
        const g = ctx.createLinearGradient(x, histCanvas.height, x, histCanvas.height - h);
        g.addColorStop(0, `rgba(49, 130, 189, ${alpha})`);
        g.addColorStop(1, `rgba(158, 202, 225, ${alpha})`);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.roundRect(x, histCanvas.height - h, w - 1.5, h, 3);
        ctx.fill();
      }
    }
    function updateBrush() {
      if (n <= 1) return;
      const left = (idx / (n - windowHours)) * 100;
      const width = ((windowHours - 0.5) / (n - 1)) * 100;
      brush.style.left = left + '%';
      brush.style.width = Math.max(width, 3) + '%';
    }

    let deckInstance;
    let mapInstance;

    function mapViewState() {
      if (!mapInstance) {
        return {
          longitude: meta.center_lng || 114.3,
          latitude: meta.center_lat || 30.5,
          zoom: meta.zoom || 10.8,
          pitch: meta.pitch || 52,
          bearing: meta.bearing || 22,
        };
      }
      const center = mapInstance.getCenter();
      return {
        longitude: center.lng,
        latitude: center.lat,
        zoom: mapInstance.getZoom(),
        pitch: mapInstance.getPitch(),
        bearing: mapInstance.getBearing(),
      };
    }

    function syncDeckView() {
      if (!deckInstance) return;
      const viewState = mapViewState();
      pitch3d = viewState.pitch > 10;
      document.getElementById('btn3d').textContent = pitch3d ? '2D' : '3D';
      deckInstance.setProps({ viewState });
    }

    function makeBaseMapStyle() {
      return 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json';
    }

    function initDeck() {
      const canvas = document.getElementById('deckCanvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - 168;
      canvas.style.background = 'transparent';

      mapInstance = new maplibregl.Map({
        container: 'mapBase',
        style: makeBaseMapStyle(),
        center: [meta.center_lng || 114.3, meta.center_lat || 30.5],
        zoom: meta.zoom || 10.8,
        pitch: meta.pitch || 52,
        bearing: meta.bearing || 22,
        interactive: true,
        attributionControl: false,
      });

      mapInstance.on('load', () => {
        console.log('Initializing deck.gl with map-backed viewState:', mapViewState());
        console.log('Available deck modules:', Object.keys(deck));
        console.log('Is H3HexagonLayer available?', !!deck.H3HexagonLayer);
        console.log('Sample data:', FULL.slice(0, 3));

        deckInstance = new deck.DeckGL({
          canvas: canvas,
          initialViewState: mapViewState(),
          controller: false,
          parameters: {
            clearColor: [0, 0, 0, 0],
          },
          layers: [createHexLayer()],
        });

        syncDeckView();
        mapInstance.on('move', syncDeckView);
        mapInstance.on('zoom', syncDeckView);
        mapInstance.on('rotate', syncDeckView);
        mapInstance.on('pitch', syncDeckView);
      });

      drawHist();
      drawTimeAxis();
      updateHud();
      renderLegend(gMax());
    }

    function createHexLayer() {
      const rawData = sliceData();
      console.log('Raw data length:', rawData ? rawData.length : 0);
      if (rawData && rawData.length > 0) {
        console.log('First data item:', rawData[0]);
        console.log('H3 index exists:', !!rawData[0].h3_index);
      }
      
      if (!rawData || rawData.length === 0) {
        return new deck.ScatterplotLayer({ id: 'empty', data: [] });
      }

      const elevationScale = Math.max(1, meta.elevation_scale || 50);
      const maxVal = Math.max(1, gMax());

      return new deck.H3HexagonLayer({
        id: 'h3-hex',
        data: rawData,
        pickable: true,
        wireframe: false,
        filled: true,
        extruded: true,
        elevationScale,
        getHexagon: d => d.h3_index,
        getFillColor: d => fillColor(elevOf(d)),
        getElevation: d => Math.max(0, elevOf(d)),
        elevationRange: [0, maxVal * 1.2],
        material: {
          ambient: 0.3,
          diffuse: 0.8,
          specular: 0.3,
          shininess: 32,
        },
        updateTriggers: {
          getFillColor: [mode],
          getElevation: [mode],
        },
      });
    }

    function cos(deg) {
      return Math.cos(deg * Math.PI / 180);
    }

    function updateLayer() {
      if (!deckInstance) return;
      deckInstance.setProps({ layers: [createHexLayer()] });
    }

    function setIdx(i) {
      idx = Math.max(0, Math.min(i, n - windowHours));
      t0slider.value = idx;
      updateLayer();
      updateBrush();
      updateHud();
      drawHist();
    }

    function setMode(m) {
      mode = m;
      renderLegend(gMax());
      updateLayer();
    }

    function toggle3d() {
      pitch3d = !pitch3d;
      if (mapInstance) {
        mapInstance.easeTo({ pitch: pitch3d ? (meta.pitch || 52) : 0, duration: 350 });
      }
      document.getElementById('btn3d').textContent = pitch3d ? '2D' : '3D';
    }

    function togglePlay() {
      playing = !playing;
      playBtn.textContent = playing ? '❚❚' : '▶';
      if (playing) {
        runPlay();
      } else if (playTimer) {
        clearTimeout(playTimer);
        playTimer = null;
      }
    }

    function runPlay() {
      if (!playing) return;
      setIdx(idx + 1);
      if (idx >= n - windowHours) {
        playing = false;
        playBtn.textContent = '▶';
        return;
      }
      playTimer = setTimeout(runPlay, 800 / speedMult());
    }

    t0slider.addEventListener('input', () => setIdx(parseInt(t0slider.value, 10)));
    document.getElementById('stepBack').addEventListener('click', () => setIdx(idx - 1));
    document.getElementById('stepFwd').addEventListener('click', () => setIdx(idx + 1));
    document.getElementById('play').addEventListener('click', togglePlay);
    document.getElementById('reset').addEventListener('click', () => { setIdx(0); });
    document.getElementById('speed').addEventListener('input', () => {
      speedValEl.textContent = speedMult().toFixed(1) + 'x';
    });
    document.getElementById('btn3d').addEventListener('click', toggle3d);
    document.querySelectorAll('input[name="m"]').forEach(el => {
      el.addEventListener('change', () => setMode(el.value));
    });

    histCanvas.addEventListener('click', (e) => {
      const rect = histCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const ratio = x / rect.width;
      setIdx(Math.floor(ratio * (n - windowHours)));
    });

    window.addEventListener('resize', () => {
      if (deckInstance) {
        const canvas = document.getElementById('deckCanvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight - 168;
        deckInstance.setProps({ width: canvas.width, height: canvas.height });
      }
      if (mapInstance) {
        mapInstance.resize();
      }
    });

    initDeck();
  </script>
</body>
</html>
