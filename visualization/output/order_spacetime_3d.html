  <script type="module">
    function showMapError(title, detail) {
      const el = document.getElementById('map');
      const esc = (s) =>
        String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/"/g, '&quot;');
      el.innerHTML =
        '<div style="padding:20px 24px;max-width:720px;color:#f85149;font:13px/1.6 system-ui,sans-serif">' +
        '<strong>' +
        esc(title) +
        '</strong><br/><br/><pre style="color:#9aa0a6;white-space:pre-wrap;word-break:break-all;font-size:11px">' +
        esc(detail) +
        '</pre><p style="color:#bdc1c6;margin-top:12px;font-size:12px">请用 <code>http://127.0.0.1</code> 本地服务打开本页（勿用 file://）。脚本会依次尝试 <code>unpkg</code> / <code>esm.sh</code> / <code>jsdelivr</code> 加载 deck 与 MapLibre；若仍失败请开代理或换网络。</p></div>';
    }

    const RASTER_DARK = {
      version: 8,
      sources: {
        osmDark: {
          type: 'raster',
          tiles: [
            'https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png',
          ],
          tileSize: 256,
          attribution: '© Stadia Maps © OpenStreetMap',
        },
      },
      layers: [{ id: 'bg', type: 'raster', source: 'osmDark', minzoom: 0, maxzoom: 22 }],
    };
    const VECTOR_FALLBACK = 'https://api.maptiler.com/maps/streets/style.json?key=get_your_own_key';
    const DEMO_STYLE = 'https://demotiles.maplibre.org/style.json';
    
    const LOCAL_STYLE = {
      version: 8,
      sources: {},
      layers: [{
        id: 'background',
        type: 'background',
        paint: { 'background-color': '#1a1a2e' }
      }]
    };

    async function tryImport(urls, label) {
      let last;
      console.log('[viz] Trying to load', label, 'from:', urls);
      for (let i = 0; i < urls.length; i++) {
        const u = urls[i];
        try {
          console.log('[viz] Attempt', i + 1, 'for', label, ':', u);
          const result = await import(u);
          console.log('[viz] Successfully loaded', label, 'from:', u);
          return result;
        } catch (e) {
          console.warn('[viz]', label, 'attempt', i + 1, 'failed:', u, '-', e.message || e);
          last = e;
        }
      }
      console.error('[viz] All attempts to load', label, 'failed');
      throw last || new Error(label + ': import failed');
    }

    async function loadLibs() {
      const DECK = '9.0.38';
      const UNPKG = 'https://unpkg.com';
      const JD = 'https://cdn.jsdelivr.net/npm';

      const mlMod = await tryImport(
        [
          JD + '/maplibre-gl@4.7.1/+esm',
          UNPKG + '/maplibre-gl@4.7.1/dist/maplibre-gl.js',
          'https://esm.sh/maplibre-gl@4.7.1',
        ],
        'maplibre-gl'
      );
      let maplibregl = mlMod.default || mlMod;
      if (maplibregl && !maplibregl.Map && maplibregl.default) maplibregl = maplibregl.default;

      /* jsdelivr 对部分 @deck.gl/mapbox 请求会 400，优先 unpkg */
      const mapboxMod = await tryImport(
        [
          JD + '/@deck.gl/mapbox@' + DECK + '/dist/index.js',
          UNPKG + '/@deck.gl/mapbox@' + DECK + '/dist/index.js',
          'https://esm.sh/@deck.gl/mapbox@' + DECK,
          JD + '/@deck.gl/mapbox@' + DECK,
          UNPKG + '/@deck.gl/mapbox@' + DECK,
        ],
        '@deck.gl/mapbox'
      );
      const h3Mod = await tryImport(
        [
          JD + '/@deck.gl/geo-layers@' + DECK + '/dist/h3-layers/h3-hexagon-layer.js',
          UNPKG + '/@deck.gl/geo-layers@' + DECK + '/dist/h3-layers/h3-hexagon-layer.js',
          'https://esm.sh/@deck.gl/geo-layers@' + DECK + '/dist/h3-layers/h3-hexagon-layer.js',
          JD + '/@deck.gl/geo-layers@' + DECK,
          UNPKG + '/@deck.gl/geo-layers@' + DECK,
        ],
        'H3HexagonLayer'
      );

      return {
        maplibregl,
        MapboxOverlay: mapboxMod.MapboxOverlay,
        H3HexagonLayer: h3Mod.default,
      };
    }

    const rawMeta = document.getElementById('embed-meta').textContent.trim();
    const rawData = document.getElementById('embed-data').textContent.trim();
    if (rawMeta.includes('@@EMBED') || rawData.includes('@@EMBED')) {
      showMapError('数据未嵌入', '请运行: python visualization/scripts/build_spacetime_deck_3d.py');
      throw new Error('placeholder');
    }
    let meta;
    let FULL;
    try {
      meta = JSON.parse(rawMeta);
      FULL = JSON.parse(rawData);
    } catch (e) {
      showMapError('JSON 解析失败', e && e.message ? e.message : String(e));
      throw e;
    }

    let maplibregl;
    let MapboxOverlay;
    let H3HexagonLayer;
    try {
      console.log('[viz] Starting library loading...');
      const libs = await loadLibs();
      console.log('[viz] Libraries loaded successfully:', Object.keys(libs));
      maplibregl = libs.maplibregl;
      MapboxOverlay = libs.MapboxOverlay;
      H3HexagonLayer = libs.H3HexagonLayer;
      console.log('[viz] maplibregl:', !!maplibregl, 'MapboxOverlay:', !!MapboxOverlay, 'H3HexagonLayer:', !!H3HexagonLayer);
    } catch (e) {
      console.error('[viz] Library loading failed:', e);
      showMapError(
        '三维库加载失败（deck.gl / MapLibre）',
        (e && e.message) || String(e) + '\n\n请检查浏览器控制台 (F12) 获取详细错误信息。'
      );
      throw e;
    }

    const slots = meta.time_slots_ms || [];
    const n = slots.length;
    const windowHours = meta.window_hours || 1;
    const hourMs = 3600000;
    let idx = 0;
    let mode = 'count';
    let playing = false;
    let playTimer = null;
    let pitch3d = true;

    let countMax = meta.count_max;
    let predictionMax = meta.prediction_max;
    if (countMax == null || predictionMax == null) {
      let cm = 1, pm = 1;
      for (const d of FULL) {
        cm = Math.max(cm, d.count);
        pm = Math.max(pm, d.prediction);
      }
      if (countMax == null) countMax = cm;
      if (predictionMax == null) predictionMax = pm;
    }

    const sums = (meta.hourly_totals || []).map(Number);
    while (sums.length < n) sums.push(0);

    const BIN = [
      { max: 1, rgb: [247, 251, 255] },
      { max: 2, rgb: [222, 235, 247] },
      { max: 5, rgb: [158, 202, 225] },
      { max: 15, rgb: [49, 130, 189] },
      { max: Infinity, rgb: [8, 81, 156] },
    ];

    function elevOf(d) {
      const v = mode === 'count' ? d.count : d.prediction;
      return Math.max(0, v);
    }
    function gMax() {
      return mode === 'count' ? countMax : predictionMax;
    }
    function fillColor(v) {
      const a = v < 1 ? 200 : v < 2 ? 215 : v < 5 ? 230 : v < 15 ? 245 : 255;
      if (v < 1) return [247, 251, 255, a];
      if (v < 2) return [222, 235, 247, a];
      if (v < 5) return [158, 202, 225, a];
      if (v < 15) return [49, 130, 189, a];
      return [8, 81, 156, 255];
    }
    function sliceData() {
      const tStart = slots[idx];
      const tEnd = slots[Math.min(idx + windowHours - 1, n - 1)] + hourMs;
      return FULL.filter((d) => d.t >= tStart && d.t < tEnd);
    }
    function renderLegend(gm) {
      const field = mode === 'count' ? 'count' : 'prediction';
      document.getElementById('legendMetric').textContent = field;
      document.getElementById('legendNote').textContent = 'Height scale by ' + field + '.';
      const top = Math.max(Number(gm) || 0, 15);
      const labels = ['1.00 to 1.00', '1.00 to 2.00', '2.00 to 5.00', '5.00 to 15.00', '15.00 to ' + top.toFixed(2)];
      const rows = document.getElementById('legendRows');
      rows.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const c = BIN[i].rgb;
        const el = document.createElement('div');
        el.className = 'leg-row';
        el.innerHTML = '<div class="leg-swatch" style="background:rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')"></div><span style="color:#bdc1c6;font-size:10px">' + labels[i] + '</span>';
        rows.appendChild(el);
      }
    }
    function updateHud() {
      const tA = new Date(slots[idx]);
      const tB = new Date(slots[Math.min(idx + windowHours - 1, n - 1)] + hourMs);
      const o = { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true };
      const r = tA.toLocaleString('en-US', o) + ' – ' + tB.toLocaleString('en-US', o);
      const d = meta.display_date || tA.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' });
      document.getElementById('centerHud').innerHTML = d + ' <span>|</span> <span>' + r + '</span>';
      document.getElementById('barDate').textContent = d;
      document.getElementById('barRange').textContent = r;
    }
    const histCanvas = document.getElementById('hist');
    const brush = document.getElementById('brush');
    const t0slider = document.getElementById('t0');
    const playBtn = document.getElementById('play');
    const speedEl = document.getElementById('speed');
    const speedValEl = document.getElementById('speedVal');
    const timeAxisEl = document.getElementById('timeAxis');

    t0slider.max = Math.max(0, n - windowHours);

    function speedMult() {
      const s = parseInt(speedEl.value, 10) || 4;
      return 0.2 + ((s - 1) / 9) * 1.2;
    }
    function drawTimeAxis() {
      timeAxisEl.innerHTML = '';
      const tickHours = [3, 6, 9, 12, 15, 18, 21];
      const fmt = new Intl.DateTimeFormat('en-US', { hour: 'numeric', hour12: true });
      for (const th of tickHours) {
        let best = -1, bestDiff = 999;
        for (let i = 0; i < n; i++) {
          const h = new Date(slots[i]).getHours();
          const diff = Math.abs(h - th);
          if (diff < bestDiff) {
            bestDiff = diff;
            best = i;
          }
        }
        if (best < 0) continue;
        const span = document.createElement('span');
        span.textContent = fmt.format(new Date(slots[best]));
        span.style.left = ((best / Math.max(1, n - 1)) * 100) + '%';
        timeAxisEl.appendChild(span);
      }
    }
    function drawHist() {
      const ctx = histCanvas.getContext('2d');
      const cssW = histCanvas.clientWidth || 800;
      const cssH = 52;
      const w = (histCanvas.width = Math.floor(cssW * devicePixelRatio));
      const h = (histCanvas.height = Math.floor(cssH * devicePixelRatio));
      ctx.clearRect(0, 0, w, h);
      const max = Math.max(1, ...sums, 1e-9);
      const len = Math.max(1, sums.length);
      const bw = w / len;
      for (let i = 0; i < len; i++) {
        const bh = ((sums[i] || 0) / max) * (h - 14 * devicePixelRatio);
        ctx.fillStyle = 'rgba(66, 133, 244, 0.55)';
        ctx.fillRect(i * bw + 0.5, h - bh - 6 * devicePixelRatio, Math.max(1, bw - 1), bh);
      }
      ctx.strokeStyle = '#3c4043';
      ctx.strokeRect(0, 0, w, h);
      const maxIdx = Math.max(0, n - windowHours);
      if (maxIdx > 0 && n > 1) {
        const cx = ((idx + (windowHours - 1) / 2) / maxIdx) * w;
        ctx.strokeStyle = 'rgba(255,255,255,0.95)';
        ctx.lineWidth = 2 * devicePixelRatio;
        ctx.beginPath();
        ctx.moveTo(cx, 2 * devicePixelRatio);
        ctx.lineTo(cx, h - 8 * devicePixelRatio);
        ctx.stroke();
      }
    }
    function brushLayout() {
      const wPct = n === 0 ? 100 : Math.max((100 * windowHours) / n, 3);
      const maxIdx = Math.max(0, n - windowHours);
      if (windowHours >= n || maxIdx === 0) {
        brush.style.left = '0%';
        brush.style.width = '100%';
      } else {
        brush.style.left = (idx / maxIdx) * (100 - wPct) + '%';
        brush.style.width = wPct + '%';
      }
    }

    let overlay;
    function buildLayer(rows) {
      const gm = gMax();
      renderLegend(gm);
      const elevTop = Math.max(gm * meta.elevation_scale * 1.08, 1);
      return new H3HexagonLayer({
        id: 'h3-3d',
        data: rows,
        getHexagon: (d) => d.h3_index,
        getElevation: elevOf,
        elevationScale: meta.elevation_scale,
        elevationRange: [0, elevTop],
        extruded: true,
        coverage: 0.88,
        getFillColor: (d) => fillColor(elevOf(d)),
        getLineColor: [200, 220, 255, 55],
        pickable: true,
        material: { ambient: 0.45, diffuse: 0.55, shininess: 18, specularColor: [80, 100, 140] },
      });
    }
    let mapReady = false;
    function redraw() {
      if (!mapReady || !overlay) return;
      const rows = sliceData();
      overlay.setProps({ layers: [buildLayer(rows)] });
      updateHud();
      brushLayout();
      drawHist();
      t0slider.value = String(idx);
    }

    function paintChromeOnly() {
      drawTimeAxis();
      drawHist();
      brushLayout();
      renderLegend(gMax());
      updateHud();
    }

    paintChromeOnly();

    const map = new maplibregl.Map({
      container: 'map',
      style: RASTER_DARK,
      center: [meta.center_lng, meta.center_lat],
      zoom: meta.zoom,
      pitch: meta.pitch,
      bearing: meta.bearing,
      antialias: true,
    });
    let styleFallbackStep = 0;
    map.on('error', (ev) => {
      console.warn('maplibre error', ev && ev.error);
      if (styleFallbackStep >= 3) return;
      try {
        if (styleFallbackStep === 0) {
          styleFallbackStep = 1;
          console.log('[viz] Falling back to DEMO_STYLE');
          map.setStyle(DEMO_STYLE);
        } else if (styleFallbackStep === 1) {
          styleFallbackStep = 2;
          console.log('[viz] Falling back to LOCAL_STYLE (no external tiles)');
          map.setStyle(LOCAL_STYLE);
        } else {
          styleFallbackStep = 3;
        }
      } catch (_) {}
    });

    overlay = new MapboxOverlay({ interleaved: false, layers: [] });
    map.addControl(overlay);
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-left');

    map.on('load', () => {
      map.resize();
      mapReady = true;
      paintChromeOnly();
      redraw();
      speedValEl.textContent = speedMult().toFixed(1) + 'x';
    });

    function tickPlay() {
      const maxIdx = Math.max(0, n - windowHours);
      idx = idx >= maxIdx ? 0 : idx + 1;
      redraw();
    }
    function startPlay() {
      if (playTimer) clearInterval(playTimer);
      if (!playing) return;
      playTimer = setInterval(tickPlay, Math.round(900 / speedMult()));
    }

    t0slider.addEventListener('input', () => {
      idx = parseInt(t0slider.value, 10) || 0;
      redraw();
    });
    document.querySelectorAll('input[name="m"]').forEach((el) => {
      el.addEventListener('change', () => {
        mode = document.querySelector('input[name="m"]:checked').value;
        redraw();
      });
    });
    let dragHist = false;
    histCanvas.addEventListener('mousedown', () => {
      dragHist = true;
      playing = false;
      playBtn.textContent = '▶';
      if (playTimer) clearInterval(playTimer);
      playTimer = null;
    });
    window.addEventListener('mouseup', () => {
      dragHist = false;
    });
    function scrubFromEvent(e) {
      const rect = histCanvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const maxIdx = Math.max(0, n - windowHours);
      idx = Math.max(0, Math.min(maxIdx, Math.round(x * maxIdx)));
      redraw();
    }
    histCanvas.addEventListener('mousemove', (e) => {
      if (dragHist) scrubFromEvent(e);
    });
    histCanvas.addEventListener('click', scrubFromEvent);

    playBtn.addEventListener('click', () => {
      playing = !playing;
      playBtn.textContent = playing ? '\u23F8' : '\u25B6';
      if (playTimer) clearInterval(playTimer);
      playTimer = null;
      if (playing) startPlay();
    });
    document.getElementById('reset').addEventListener('click', () => {
      idx = 0;
      redraw();
    });
    document.getElementById('stepBack').addEventListener('click', () => {
      idx = Math.max(0, idx - 1);
      redraw();
    });
    document.getElementById('stepFwd').addEventListener('click', () => {
      idx = Math.min(Math.max(0, n - windowHours), idx + 1);
      redraw();
    });
    speedEl.addEventListener('input', () => {
      speedValEl.textContent = speedMult().toFixed(1) + 'x';
      if (playing) startPlay();
    });
    document.getElementById('btn3d').addEventListener('click', () => {
      if (!mapReady) return;
      pitch3d = !pitch3d;
      map.easeTo({ pitch: pitch3d ? meta.pitch : 0, duration: 500 });
    });
    window.addEventListener('resize', () => {
      map.resize();
      drawHist();
      drawTimeAxis();
      brushLayout();
    });
  </script>
</body>
</html>
