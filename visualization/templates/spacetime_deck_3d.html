<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>订单时空 · 3D H3</title>
  <script type="importmap">
  {
    "imports": {
      "@deck.gl/core": "https://unpkg.com/@deck.gl/core@9.0.38/dist/index.js",
      "@deck.gl/core/": "https://unpkg.com/@deck.gl/core@9.0.38/dist/",
      "@deck.gl/layers": "https://unpkg.com/@deck.gl/layers@9.0.38/dist/index.js",
      "@deck.gl/layers/": "https://unpkg.com/@deck.gl/layers@9.0.38/dist/",
      "@luma.gl/constants": "https://unpkg.com/@luma.gl/constants@9.0.27/dist/index.js",
      "@luma.gl/constants/": "https://unpkg.com/@luma.gl/constants@9.0.27/dist/",
      "@luma.gl/core": "https://unpkg.com/@luma.gl/core@9.0.27/dist/index.js",
      "@luma.gl/core/": "https://unpkg.com/@luma.gl/core@9.0.27/dist/",
      "@luma.gl/engine": "https://unpkg.com/@luma.gl/engine@9.0.27/dist/index.js",
      "@luma.gl/engine/": "https://unpkg.com/@luma.gl/engine@9.0.27/dist/",
      "@luma.gl/shadertools": "https://unpkg.com/@luma.gl/shadertools@9.0.27/dist/index.js",
      "@luma.gl/shadertools/": "https://unpkg.com/@luma.gl/shadertools@9.0.27/dist/",
      "@luma.gl/webgl": "https://unpkg.com/@luma.gl/webgl@9.0.27/dist/index.js",
      "@luma.gl/webgl/": "https://unpkg.com/@luma.gl/webgl@9.0.27/dist/",
      "@loaders.gl/core": "https://unpkg.com/@loaders.gl/core@4.2.0/dist/index.js",
      "@loaders.gl/core/": "https://unpkg.com/@loaders.gl/core@4.2.0/dist/",
      "@loaders.gl/images": "https://unpkg.com/@loaders.gl/images@4.2.0/dist/index.js",
      "@loaders.gl/images/": "https://unpkg.com/@loaders.gl/images@4.2.0/dist/",
      "@loaders.gl/schema": "https://unpkg.com/@loaders.gl/schema@4.2.0/dist/index.js",
      "@loaders.gl/schema/": "https://unpkg.com/@loaders.gl/schema@4.2.0/dist/",
      "@loaders.gl/loader-utils": "https://unpkg.com/@loaders.gl/loader-utils@4.2.0/dist/index.js",
      "@loaders.gl/loader-utils/": "https://unpkg.com/@loaders.gl/loader-utils@4.2.0/dist/",
      "@math.gl/core": "https://unpkg.com/@math.gl/core@4.1.0/dist/index.js",
      "@math.gl/core/": "https://unpkg.com/@math.gl/core@4.1.0/dist/",
      "@math.gl/polygon": "https://unpkg.com/@math.gl/polygon@4.1.0/dist/index.js",
      "@math.gl/polygon/": "https://unpkg.com/@math.gl/polygon@4.1.0/dist/",
      "@math.gl/web-mercator": "https://unpkg.com/@math.gl/web-mercator@4.1.0/dist/index.js",
      "@math.gl/web-mercator/": "https://unpkg.com/@math.gl/web-mercator@4.1.0/dist/",
      "@math.gl/sun": "https://unpkg.com/@math.gl/sun@4.1.0/dist/index.js",
      "@math.gl/sun/": "https://unpkg.com/@math.gl/sun@4.1.0/dist/",
      "@math.gl/types": "https://unpkg.com/@math.gl/types@4.1.0/dist/index.js",
      "@math.gl/types/": "https://unpkg.com/@math.gl/types@4.1.0/dist/",
      "@probe.gl/env": "https://unpkg.com/@probe.gl/env@4.0.9/dist/index.js",
      "@probe.gl/env/": "https://unpkg.com/@probe.gl/env@4.0.9/dist/",
      "@probe.gl/log": "https://unpkg.com/@probe.gl/log@4.0.9/dist/index.js",
      "@probe.gl/log/": "https://unpkg.com/@probe.gl/log@4.0.9/dist/",
      "@probe.gl/stats": "https://unpkg.com/@probe.gl/stats@4.0.9/dist/index.js",
      "@probe.gl/stats/": "https://unpkg.com/@probe.gl/stats@4.0.9/dist/",
      "earcut": "https://esm.sh/earcut@2.2.4",
      "gl-matrix": "https://unpkg.com/gl-matrix@3.4.3/esm/index.js",
      "h3-js": "https://unpkg.com/h3-js@4.1.0/dist/h3-js.es.js",
      "mjolnir.js": "https://esm.sh/mjolnir.js@2.7.0"
    }
  }
  </script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" crossorigin="anonymous" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #0b0c0f; color: #e8eaed; }
    #map { position: absolute; top: 0; left: 0; right: 0; bottom: 168px; }
    #bar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 168px;
      background: linear-gradient(180deg, #14151a 0%, #0b0c0f 100%);
      border-top: 1px solid #2d2f36;
      padding: 10px 16px 12px;
      box-sizing: border-box;
    }
    #centerHud {
      position: absolute; left: 50%; bottom: 188px; transform: translateX(-50%);
      z-index: 2; text-align: center; pointer-events: none; max-width: 92vw;
      padding: 8px 14px; border-radius: 4px;
      background: rgba(11, 12, 15, 0.72); border: 1px solid rgba(60, 64, 67, 0.7);
      font-size: 13px; color: #e8eaed; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    #centerHud span { color: #bdc1c6; font-variant-numeric: tabular-nums; }
    #legend {
      position: absolute; top: 12px; right: 12px; width: 168px; z-index: 2;
      background: rgba(20,21,26,0.92); border: 1px solid #3c4043; border-radius: 2px;
      padding: 10px 10px 8px; font-size: 10px; color: #9aa0a6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    #legend h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; color: #e8eaed; border-bottom: 1px solid #3c4043; padding-bottom: 6px; }
    .legend-metric { font-size: 11px; font-weight: 600; color: #e8eaed; margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid #3c4043; }
    .leg-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .leg-swatch { width: 12px; height: 12px; border-radius: 1px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.12); }
    .legend-note { margin-top: 8px; padding-top: 6px; border-top: 1px solid #3c4043; font-size: 9px; color: #80868b; }
    #mode {
      position: absolute; top: 12px; left: 12px; z-index: 2;
      background: rgba(20,21,26,0.92); border: 1px solid #3c4043; border-radius: 2px;
      padding: 6px 10px; font-size: 11px;
    }
    #mode label { margin-right: 12px; cursor: pointer; color: #bdc1c6; }
    #mapTools { position: absolute; top: 52px; right: 12px; z-index: 2; }
    #mapTools button {
      width: 32px; height: 32px; background: rgba(20,21,26,0.92); border: 1px solid #3c4043;
      border-radius: 2px; color: #e8eaed; font-size: 12px; cursor: pointer;
    }
    #barHeader { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; font-size: 12px; color: #bdc1c6; }
    #histWrap { height: 52px; margin: 4px 0; position: relative; }
    #hist { width: 100%; height: 52px; display: block; cursor: pointer; border-radius: 2px; background: #1a1b21; }
    #brush {
      position: absolute; top: 0; bottom: 22px; left: 0%; width: 30%;
      border: 1px solid rgba(255,255,255,0.9); border-radius: 2px; pointer-events: none;
      box-sizing: border-box;
    }
    #timeAxis { height: 18px; position: relative; font-size: 10px; color: #9aa0a6; }
    #timeAxis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
    #controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; justify-content: space-between; }
    button.ctl {
      background: #1a1b21; color: #e8eaed; border: 1px solid #3c4043; border-radius: 2px;
      padding: 5px 10px; font-size: 11px; cursor: pointer;
    }
    #speedWrap { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #9aa0a6; }
    #t0 { flex: 1; min-width: 160px; max-width: 420px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="centerHud" aria-hidden="true"></div>
  <div id="mode">
    <label><input type="radio" name="m" value="count" checked /> 实测 count</label>
    <label><input type="radio" name="m" value="prediction" /> 预测 prediction</label>
  </div>
  <div id="legend">
    <h3>Layer Legend</h3>
    <div id="legendMetric" class="legend-metric">count</div>
    <div id="legendRows"></div>
    <div class="legend-note" id="legendNote">Height scale by count.</div>
  </div>
  <div id="mapTools"><button type="button" id="btn3d" title="2D/3D">3D</button></div>
  <div id="bar">
    <div id="barHeader"><span id="barDate"></span><span id="barRange"></span></div>
    <div id="histWrap">
      <canvas id="hist" width="1200" height="52"></canvas>
      <div id="brush"></div>
    </div>
    <div id="timeAxis"></div>
    <div id="controls">
      <input type="range" id="t0" min="0" max="0" value="0" title="时间" />
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button type="button" class="ctl" id="stepBack">|◀</button>
        <button type="button" class="ctl" id="stepFwd">▶|</button>
        <button type="button" class="ctl" id="play">▶</button>
        <button type="button" class="ctl" id="reset">⟲</button>
        <div id="speedWrap"><span>Speed</span><input type="range" id="speed" min="1" max="10" value="4" style="width:100px" /><span id="speedVal">1x</span></div>
      </div>
    </div>
  </div>

  <script type="application/json" id="embed-meta">@@EMBED_META@@</script>
  <script type="application/json" id="embed-data">@@EMBED_DATA@@</script>

  <script type="module">
    function showMapError(title, detail) {
      const el = document.getElementById('map');
      const esc = (s) =>
        String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/"/g, '&quot;');
      el.innerHTML =
        '<div style="padding:20px 24px;max-width:720px;color:#f85149;font:13px/1.6 system-ui,sans-serif">' +
        '<strong>' +
        esc(title) +
        '</strong><br/><br/><pre style="color:#9aa0a6;white-space:pre-wrap;word-break:break-all;font-size:11px">' +
        esc(detail) +
        '</pre><p style="color:#bdc1c6;margin-top:12px;font-size:12px">请用 <code>http://127.0.0.1</code> 本地服务打开本页（勿用 file://）。脚本会依次尝试 <code>unpkg</code> / <code>esm.sh</code> / <code>jsdelivr</code> 加载 deck 与 MapLibre；若仍失败请开代理或换网络。</p></div>';
    }

    const RASTER_DARK = {
      version: 8,
      sources: {
        cartoDark: {
          type: 'raster',
          tiles: [
            'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
            'https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
            'https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
          ],
          tileSize: 256,
          attribution: '© CARTO © OSM',
        },
      },
      layers: [{ id: 'bg', type: 'raster', source: 'cartoDark', minzoom: 0, maxzoom: 22 }],
    };
    const VECTOR_FALLBACK = 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json';
    const DEMO_STYLE = 'https://demotiles.maplibre.org/style.json';

    async function tryImport(urls, label) {
      let last;
      for (const u of urls) {
        try {
          return await import(u);
        } catch (e) {
          console.warn('[viz]', label, 'fail', u, e);
          last = e;
        }
      }
      throw last || new Error(label + ': import failed');
    }

    async function loadLibs() {
      const DECK = '9.0.38';
      const UNPKG = 'https://unpkg.com';
      const JD = 'https://cdn.jsdelivr.net/npm';

      const mlMod = await tryImport(
        [
          'https://esm.sh/maplibre-gl@4.7.1',
          UNPKG + '/maplibre-gl@4.7.1/dist/maplibre-gl.js',
          JD + '/maplibre-gl@4.7.1/+esm',
        ],
        'maplibre-gl'
      );
      let maplibregl = mlMod.default || mlMod;
      if (maplibregl && !maplibregl.Map && maplibregl.default) maplibregl = maplibregl.default;

      /* jsdelivr 对部分 @deck.gl/mapbox 请求会 400，优先 unpkg */
      const mapboxMod = await tryImport(
        [
          UNPKG + '/@deck.gl/mapbox@' + DECK + '/dist/index.js',
          'https://esm.sh/@deck.gl/mapbox@' + DECK,
          JD + '/@deck.gl/mapbox@' + DECK + '/dist/index.js',
        ],
        '@deck.gl/mapbox'
      );
      const h3Mod = await tryImport(
        [
          UNPKG + '/@deck.gl/geo-layers@' + DECK + '/dist/h3-layers/h3-hexagon-layer.js',
          JD + '/@deck.gl/geo-layers@' + DECK + '/dist/h3-layers/h3-hexagon-layer.js',
        ],
        'H3HexagonLayer'
      );

      return {
        maplibregl,
        MapboxOverlay: mapboxMod.MapboxOverlay,
        H3HexagonLayer: h3Mod.default,
      };
    }

    const rawMeta = document.getElementById('embed-meta').textContent.trim();
    const rawData = document.getElementById('embed-data').textContent.trim();
    if (rawMeta.includes('@@EMBED') || rawData.includes('@@EMBED')) {
      showMapError('数据未嵌入', '请运行: python visualization/scripts/build_spacetime_deck_3d.py');
      throw new Error('placeholder');
    }
    let meta;
    let FULL;
    try {
      meta = JSON.parse(rawMeta);
      FULL = JSON.parse(rawData);
    } catch (e) {
      showMapError('JSON 解析失败', e && e.message ? e.message : String(e));
      throw e;
    }

    let maplibregl;
    let MapboxOverlay;
    let H3HexagonLayer;
    try {
      const libs = await loadLibs();
      maplibregl = libs.maplibregl;
      MapboxOverlay = libs.MapboxOverlay;
      H3HexagonLayer = libs.H3HexagonLayer;
    } catch (e) {
      console.error(e);
      showMapError(
        '三维库加载失败（deck.gl / MapLibre）',
        (e && e.message) || String(e)
      );
      throw e;
    }

    const slots = meta.time_slots_ms || [];
    const n = slots.length;
    const windowHours = meta.window_hours || 1;
    const hourMs = 3600000;
    let idx = 0;
    let mode = 'count';
    let playing = false;
    let playTimer = null;
    let pitch3d = true;

    let countMax = meta.count_max;
    let predictionMax = meta.prediction_max;
    if (countMax == null || predictionMax == null) {
      let cm = 1, pm = 1;
      for (const d of FULL) {
        cm = Math.max(cm, d.count);
        pm = Math.max(pm, d.prediction);
      }
      if (countMax == null) countMax = cm;
      if (predictionMax == null) predictionMax = pm;
    }

    const sums = (meta.hourly_totals || []).map(Number);
    while (sums.length < n) sums.push(0);

    const BIN = [
      { max: 1, rgb: [247, 251, 255] },
      { max: 2, rgb: [222, 235, 247] },
      { max: 5, rgb: [158, 202, 225] },
      { max: 15, rgb: [49, 130, 189] },
      { max: Infinity, rgb: [8, 81, 156] },
    ];

    function elevOf(d) {
      const v = mode === 'count' ? d.count : d.prediction;
      return Math.max(0, v);
    }
    function gMax() {
      return mode === 'count' ? countMax : predictionMax;
    }
    function fillColor(v) {
      const a = v < 1 ? 200 : v < 2 ? 215 : v < 5 ? 230 : v < 15 ? 245 : 255;
      if (v < 1) return [247, 251, 255, a];
      if (v < 2) return [222, 235, 247, a];
      if (v < 5) return [158, 202, 225, a];
      if (v < 15) return [49, 130, 189, a];
      return [8, 81, 156, 255];
    }
    function sliceData() {
      const tStart = slots[idx];
      const tEnd = slots[Math.min(idx + windowHours - 1, n - 1)] + hourMs;
      return FULL.filter((d) => d.t >= tStart && d.t < tEnd);
    }
    function renderLegend(gm) {
      const field = mode === 'count' ? 'count' : 'prediction';
      document.getElementById('legendMetric').textContent = field;
      document.getElementById('legendNote').textContent = 'Height scale by ' + field + '.';
      const top = Math.max(Number(gm) || 0, 15);
      const labels = ['1.00 to 1.00', '1.00 to 2.00', '2.00 to 5.00', '5.00 to 15.00', '15.00 to ' + top.toFixed(2)];
      const rows = document.getElementById('legendRows');
      rows.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const c = BIN[i].rgb;
        const el = document.createElement('div');
        el.className = 'leg-row';
        el.innerHTML = '<div class="leg-swatch" style="background:rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')"></div><span style="color:#bdc1c6;font-size:10px">' + labels[i] + '</span>';
        rows.appendChild(el);
      }
    }
    function updateHud() {
      const tA = new Date(slots[idx]);
      const tB = new Date(slots[Math.min(idx + windowHours - 1, n - 1)] + hourMs);
      const o = { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true };
      const r = tA.toLocaleString('en-US', o) + ' – ' + tB.toLocaleString('en-US', o);
      const d = meta.display_date || tA.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' });
      document.getElementById('centerHud').innerHTML = d + ' <span>|</span> <span>' + r + '</span>';
      document.getElementById('barDate').textContent = d;
      document.getElementById('barRange').textContent = r;
    }
    const histCanvas = document.getElementById('hist');
    const brush = document.getElementById('brush');
    const t0slider = document.getElementById('t0');
    const playBtn = document.getElementById('play');
    const speedEl = document.getElementById('speed');
    const speedValEl = document.getElementById('speedVal');
    const timeAxisEl = document.getElementById('timeAxis');

    t0slider.max = Math.max(0, n - windowHours);

    function speedMult() {
      const s = parseInt(speedEl.value, 10) || 4;
      return 0.2 + ((s - 1) / 9) * 1.2;
    }
    function drawTimeAxis() {
      timeAxisEl.innerHTML = '';
      const tickHours = [3, 6, 9, 12, 15, 18, 21];
      const fmt = new Intl.DateTimeFormat('en-US', { hour: 'numeric', hour12: true });
      for (const th of tickHours) {
        let best = -1, bestDiff = 999;
        for (let i = 0; i < n; i++) {
          const h = new Date(slots[i]).getHours();
          const diff = Math.abs(h - th);
          if (diff < bestDiff) {
            bestDiff = diff;
            best = i;
          }
        }
        if (best < 0) continue;
        const span = document.createElement('span');
        span.textContent = fmt.format(new Date(slots[best]));
        span.style.left = ((best / Math.max(1, n - 1)) * 100) + '%';
        timeAxisEl.appendChild(span);
      }
    }
    function drawHist() {
      const ctx = histCanvas.getContext('2d');
      const cssW = histCanvas.clientWidth || 800;
      const cssH = 52;
      const w = (histCanvas.width = Math.floor(cssW * devicePixelRatio));
      const h = (histCanvas.height = Math.floor(cssH * devicePixelRatio));
      ctx.clearRect(0, 0, w, h);
      const max = Math.max(1, ...sums, 1e-9);
      const len = Math.max(1, sums.length);
      const bw = w / len;
      for (let i = 0; i < len; i++) {
        const bh = ((sums[i] || 0) / max) * (h - 14 * devicePixelRatio);
        ctx.fillStyle = 'rgba(66, 133, 244, 0.55)';
        ctx.fillRect(i * bw + 0.5, h - bh - 6 * devicePixelRatio, Math.max(1, bw - 1), bh);
      }
      ctx.strokeStyle = '#3c4043';
      ctx.strokeRect(0, 0, w, h);
      const maxIdx = Math.max(0, n - windowHours);
      if (maxIdx > 0 && n > 1) {
        const cx = ((idx + (windowHours - 1) / 2) / maxIdx) * w;
        ctx.strokeStyle = 'rgba(255,255,255,0.95)';
        ctx.lineWidth = 2 * devicePixelRatio;
        ctx.beginPath();
        ctx.moveTo(cx, 2 * devicePixelRatio);
        ctx.lineTo(cx, h - 8 * devicePixelRatio);
        ctx.stroke();
      }
    }
    function brushLayout() {
      const wPct = n === 0 ? 100 : Math.max((100 * windowHours) / n, 3);
      const maxIdx = Math.max(0, n - windowHours);
      if (windowHours >= n || maxIdx === 0) {
        brush.style.left = '0%';
        brush.style.width = '100%';
      } else {
        brush.style.left = (idx / maxIdx) * (100 - wPct) + '%';
        brush.style.width = wPct + '%';
      }
    }

    let overlay;
    function buildLayer(rows) {
      const gm = gMax();
      renderLegend(gm);
      const elevTop = Math.max(gm * meta.elevation_scale * 1.08, 1);
      return new H3HexagonLayer({
        id: 'h3-3d',
        data: rows,
        getHexagon: (d) => d.h3_index,
        getElevation: elevOf,
        elevationScale: meta.elevation_scale,
        elevationRange: [0, elevTop],
        extruded: true,
        coverage: 0.88,
        getFillColor: (d) => fillColor(elevOf(d)),
        getLineColor: [200, 220, 255, 55],
        pickable: true,
        material: { ambient: 0.45, diffuse: 0.55, shininess: 18, specularColor: [80, 100, 140] },
      });
    }
    let mapReady = false;
    function redraw() {
      if (!mapReady || !overlay) return;
      const rows = sliceData();
      overlay.setProps({ layers: [buildLayer(rows)] });
      updateHud();
      brushLayout();
      drawHist();
      t0slider.value = String(idx);
    }

    function paintChromeOnly() {
      drawTimeAxis();
      drawHist();
      brushLayout();
      renderLegend(gMax());
      updateHud();
    }

    paintChromeOnly();

    const map = new maplibregl.Map({
      container: 'map',
      style: RASTER_DARK,
      center: [meta.center_lng, meta.center_lat],
      zoom: meta.zoom,
      pitch: meta.pitch,
      bearing: meta.bearing,
      antialias: true,
    });
    let styleFallbackStep = 0;
    map.on('error', (ev) => {
      console.warn('maplibre error', ev && ev.error);
      if (styleFallbackStep >= 2) return;
      try {
        if (styleFallbackStep === 0) {
          styleFallbackStep = 1;
          map.setStyle(VECTOR_FALLBACK);
        } else {
          styleFallbackStep = 2;
          map.setStyle(DEMO_STYLE);
        }
      } catch (_) {}
    });

    overlay = new MapboxOverlay({ interleaved: false, layers: [] });
    map.addControl(overlay);
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-left');

    map.on('load', () => {
      map.resize();
      mapReady = true;
      paintChromeOnly();
      redraw();
      speedValEl.textContent = speedMult().toFixed(1) + 'x';
    });

    function tickPlay() {
      const maxIdx = Math.max(0, n - windowHours);
      idx = idx >= maxIdx ? 0 : idx + 1;
      redraw();
    }
    function startPlay() {
      if (playTimer) clearInterval(playTimer);
      if (!playing) return;
      playTimer = setInterval(tickPlay, Math.round(900 / speedMult()));
    }

    t0slider.addEventListener('input', () => {
      idx = parseInt(t0slider.value, 10) || 0;
      redraw();
    });
    document.querySelectorAll('input[name="m"]').forEach((el) => {
      el.addEventListener('change', () => {
        mode = document.querySelector('input[name="m"]:checked').value;
        redraw();
      });
    });
    let dragHist = false;
    histCanvas.addEventListener('mousedown', () => {
      dragHist = true;
      playing = false;
      playBtn.textContent = '▶';
      if (playTimer) clearInterval(playTimer);
      playTimer = null;
    });
    window.addEventListener('mouseup', () => {
      dragHist = false;
    });
    function scrubFromEvent(e) {
      const rect = histCanvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const maxIdx = Math.max(0, n - windowHours);
      idx = Math.max(0, Math.min(maxIdx, Math.round(x * maxIdx)));
      redraw();
    }
    histCanvas.addEventListener('mousemove', (e) => {
      if (dragHist) scrubFromEvent(e);
    });
    histCanvas.addEventListener('click', scrubFromEvent);

    playBtn.addEventListener('click', () => {
      playing = !playing;
      playBtn.textContent = playing ? '\u23F8' : '\u25B6';
      if (playTimer) clearInterval(playTimer);
      playTimer = null;
      if (playing) startPlay();
    });
    document.getElementById('reset').addEventListener('click', () => {
      idx = 0;
      redraw();
    });
    document.getElementById('stepBack').addEventListener('click', () => {
      idx = Math.max(0, idx - 1);
      redraw();
    });
    document.getElementById('stepFwd').addEventListener('click', () => {
      idx = Math.min(Math.max(0, n - windowHours), idx + 1);
      redraw();
    });
    speedEl.addEventListener('input', () => {
      speedValEl.textContent = speedMult().toFixed(1) + 'x';
      if (playing) startPlay();
    });
    document.getElementById('btn3d').addEventListener('click', () => {
      if (!mapReady) return;
      pitch3d = !pitch3d;
      map.easeTo({ pitch: pitch3d ? meta.pitch : 0, duration: 500 });
    });
    window.addEventListener('resize', () => {
      map.resize();
      drawHist();
      drawTimeAxis();
      brushLayout();
    });
  </script>
</body>
</html>
